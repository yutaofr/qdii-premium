# ---------------- 跨日归一化因子（评审 R4：各基金净值日期不同时仍可比较） ----------------
# I(a)：Nasdaq 官方 NDX 日收盘；X0：中国货币网当日 USD/CNY 中间价（L0_FX_T，PH0-06/07 已核验）

[[endpoint]]
id = "nasdaq.ndx_history"
source_id = "nasdaq"
url = "https://api.nasdaq.com/api/quote/NDX/historical?assetclass=index&fromdate={from_date}&todate={to_date}&limit=40"
idle_interval_s = 3600

[[endpoint]]
id = "chinamoney.ccpr"
source_id = "chinamoney"
url = "https://www.chinamoney.com.cn/ags/ms/cm-u-bk-ccpr/CcprHisNew?currency=USD/CNY&pageNum=1&pageSize=40"
idle_interval_s = 3600

# ---------------- NQ（盘中估算：F(t) 与昨结算 F(c)，勘误 E8） ----------------
# 实际是否请求受 collector.toml 的主机窗口约束（A 股窗口）。

[[endpoint]]
id = "sina.hf_NQ"
source_id = "sina"
# 连续代码 + 最近两个季月合约（身份已知）：同一请求取回，估算固定用单一月份合约，连续代码只作对照
url = "https://hq.sinajs.cn/list=hf_NQ,{nq_quarterlies}"
headers = { Referer = "https://finance.sina.com.cn/" }
idle_interval_s = 60
windows = [
  { tz = "Asia/Shanghai", start = "09:10", end = "15:10", interval_s = 5 },
]

# 新浪连续合约日线：独立的日频序列，用于换月识别与结算字段核查（D4）。只录制，不进入在线估算。
[[endpoint]]
id = "sina.nq_daily_kline"
source_id = "sina"
url = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20_NQ=/GlobalFuturesService.getGlobalFuturesDailyKLine?symbol=NQ"
headers = { Referer = "https://finance.sina.com.cn/" }
idle_interval_s = 3600

