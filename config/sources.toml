# Phase 0 采集端点（DS-02 ~ DS-08）。
# 端点窗口是交易时段的超集，只决定轮询频率，不表达是否开市（见 pipeline/windows.py）。
# 所有轮询另受 collector.toml 的 [host_window]（巴黎 07:30 至 A 股收盘）约束，窗口外一律不请求。
# 新浪端点须带 Referer（2026-09-15 法国主机实测，DS-08 已接受）。

[defaults]
user_agent = "qdii-premium-collector/0.1 (personal research)"
timeout_s = 15

# ---------------- ETF 报价 ----------------

[[endpoint]]
id = "sina.etf_batch"
source_id = "sina"
url = "https://hq.sinajs.cn/list=sh513100,sz159696,sz159501,sz159660,sh513390"
headers = { Referer = "https://finance.sina.com.cn/" }
contract = "sina_a_share_v1"
idle_interval_s = 600
windows = [
  { tz = "Asia/Shanghai", start = "09:10", end = "15:10", interval_s = 5 },
]

[[endpoint]]
id = "tencent.etf_batch"
source_id = "tencent"
url = "https://qt.gtimg.cn/q=sh513100,sz159696,sz159501,sz159660,sh513390"
idle_interval_s = 1800
windows = [
  { tz = "Asia/Shanghai", start = "09:10", end = "15:10", interval_s = 15 },
]

[[endpoint]]
id = "eastmoney.stock_get.513100"
source_id = "eastmoney"
url = "https://push2.eastmoney.com/api/qt/stock/get?secid=1.513100&fields=f43,f57,f58,f59,f60,f86"
idle_interval_s = 1800
windows = [
  { tz = "Asia/Shanghai", start = "09:10", end = "15:10", interval_s = 30 },
]

